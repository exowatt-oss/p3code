name: Public core CI

on:
  push:
    branches: [oss/export]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Install pnpm
        run: npm install --global pnpm@12.14.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck (four workers)
        run: pnpm exec vp run typecheck
      - name: Build server and web (four workers)
        run: pnpm exec vp run --filter t3 --filter @t3tools/web --concurrency-limit 4 build
      - name: Offline integration tests (four workers)
        run: >-
          pnpm exec vp test run
          packages/contracts/src/settings.test.ts
          apps/server/src/serverSettings.test.ts
          apps/server/src/feads/FeadsConfig.test.ts
          apps/server/src/feads/FeadsService.test.ts
          apps/server/src/provider/phi/PhiRpc.test.ts
          apps/server/src/exowattConnectorAutoConnect.test.ts
          apps/server/src/triage/TriageService.test.ts
          apps/server/src/triage/triagePrompt.test.ts
          apps/server/src/cli/update.test.ts
          scripts/install.test.ts
          apps/web/src/legalLinks.test.ts
          apps/mobile/src/features/settings/lib/legal-document-url.test.ts
          apps/mobile/src/features/settings/environment-maintenance.test.ts
          apps/desktop/src/updates/DesktopUpdates.test.ts
          --maxWorkers=4
